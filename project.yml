# KümesPro iOS (yerel SwiftUI) — XcodeGen proje tanımı.
# Xcode projesi elle tutulmaz; bulut Mac'te `xcodegen generate` ile üretilir.
name: KumesPro
options:
  bundleIdPrefix: com.kamilsaim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: NBTXFU47EV
packages:
  KumesCekirdek:
    path: Paketler/KumesCekirdek
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  KumesProArayuzTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ArayuzTestleri]
    dependencies:
      - target: KumesPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilsaim.kumespro.arayuztests
        GENERATE_INFOPLIST_FILE: YES
  KumesPro:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - KumesProArayuzTests
    sources:
      - path: KumesPro
        excludes:
          - "**/OFL-*.txt"
          - Info.plist
          - KumesPro.entitlements
    dependencies:
      - package: KumesCekirdek
      - package: Supabase
        product: Supabase
      - target: KumesProWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilsaim.kumespro
        PRODUCT_NAME: KumesPro
        MARKETING_VERSION: "8.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: KumesPro/KumesPro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KumesPro/Info.plist
      properties:
        CFBundleDisplayName: KümesPro
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIAppFonts:
          - DelaGothicOne-Regular.ttf
        UILaunchScreen:
          UIColorName: Zemin
          UIImageName: Acilis
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.kamilsaim.kumespro
            CFBundleURLSchemes: [com.kamilsaim.kumespro]
        # İkona basılı tutma menüsü — Yerel/Kisayollar.swift
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.kamilsaim.kumespro.satis
            UIApplicationShortcutItemTitle: Satış ekle
            UIApplicationShortcutItemIconSymbolName: tag.fill
          - UIApplicationShortcutItemType: com.kamilsaim.kumespro.gider
            UIApplicationShortcutItemTitle: Gider ekle
            UIApplicationShortcutItemIconSymbolName: creditcard.fill
          - UIApplicationShortcutItemType: com.kamilsaim.kumespro.kulucka
            UIApplicationShortcutItemTitle: Kuluçka başlat
            UIApplicationShortcutItemIconSymbolName: oval.portrait.fill

  # Ana ekran widget'ı. Bundle + App Group (group.com.kamilsaim.kumespro) Capacitor döneminden portalda tanımlı.
  KumesProWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KumesProWidget
        excludes:
          - Info.plist
          - KumesProWidget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilsaim.kumespro.KumesProWidget
        PRODUCT_NAME: KumesProWidget
        MARKETING_VERSION: "8.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: KumesProWidget/KumesProWidget.entitlements
    info:
      path: KumesProWidget/Info.plist
      properties:
        CFBundleDisplayName: KümesPro
        CFBundleDevelopmentRegion: tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
