# KümesPro iOS (yerel SwiftUI) — bulut Mac'te derle, imzala, TestFlight'a yükle.
# YALNIZ ELLE: gh workflow run ios-testflight.yml -R kamilsaim/kumespro-ios-yerel -f surum=8.0
# Gizli ayarlar: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, DIST_CERT_P12_BASE64, DIST_CERT_PASSWORD
# (kaynak: C:\mac\IOS-BULUT-DERLEME-REHBERI.md). macOS dakikası kıt: her düzeltmede çalıştırma.
name: iOS - TestFlight

on:
  workflow_dispatch:
    inputs:
      surum:
        description: "App Store'da görünen sürüm"
        required: true
        default: "8.0"

jobs:
  derle:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode seç (en yeni kararlı)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Xcode projesini üret (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Sürüm ve derleme numarası
        # Derleme numarası her yüklemede büyümeli. +100: aynı kayıtta Capacitor dönemi derlemeleri var.
        run: |
          DERLEME=$(( 100 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          for PLIST in KumesPro/Info.plist KumesProWidget/Info.plist; do
            plutil -replace CFBundleShortVersionString -string "$SURUM" "$PLIST"
            plutil -replace CFBundleVersion -string "$DERLEME" "$PLIST"
          done
          echo "Sürüm $SURUM, derleme $DERLEME"
        env:
          SURUM: ${{ inputs.surum }}

      - name: Dağıtım sertifikasını yerleştir
        run: echo "$DIST_CERT_P12_BASE64" | base64 --decode > dagitim.p12
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}

      - name: Derle, imzala, TestFlight'a yükle
        run: bundle exec fastlane ios testflight_yukle
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Hata olursa derleme kayıtlarını sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-kayitlari
          path: ~/Library/Logs/gym
          if-no-files-found: ignore
          retention-days: 7

      - name: Sertifikayı sil
        if: always()
        run: rm -f dagitim.p12
