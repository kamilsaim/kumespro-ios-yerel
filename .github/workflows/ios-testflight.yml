name: iOS derleme kontrolu
on:
  workflow_dispatch:
jobs:
  derleme:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Simulator icin imzasiz derle
        run: |
          set -o pipefail
          xcodebuild -project KumesPro.xcodeproj -scheme KumesPro -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee derleme.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-derleme-kaydi
          path: derleme.log
          retention-days: 7
